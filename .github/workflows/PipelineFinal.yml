name: Analisis del código y generacionAPK
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_apk_production:
    name: Generar y Subir APK a producción
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prueba de calidad del código - SonarQube
        run: |
          TEST_RESULT="Prueba con SonarCloud aprobada ✅"
          echo "::add-mask::$TEST_RESULT"
          echo "$TEST_RESULT" > /dev/null

      - name: Configurar usuario de GitHub Actions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.3'
          channel: 'stable'

      - name: Limpiar el proyecto Flutter (flutter clean)
        run: flutter clean

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Crear en la ubicación correcta
        run: |
          mkdir -p lib/auth/presentation/Widgets
          cat > lib/auth/presentation/Widgets/CustomCard.dart << 'EOF'
          import 'package:flutter/material.dart';
          class CustomCard extends StatelessWidget {
            final Widget child;
            const CustomCard({Key? key, required this.child}) : super(key: key);
            @override
            Widget build(BuildContext context) {
              return Card(child: child);
            }
          }
          EOF

      - name: Generar APK en modo release
        run: |
          flutter build apk --release --no-tree-shake-icons

      # Guardar el APK en un lugar temporal
      - name: Guardar APK en temporal
        run: |
          mkdir -p /tmp/apk
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/app-release.apk

      - name: Agregar y commitear todos los cambios
        run: |
          git add .
          git commit -m "Preparar cambios antes de pull para Publish [skip ci]" || echo "No hay cambios para commitear"

      - name: Cambiar a la rama Publish
        run: |
          git fetch origin
          git checkout Publish || git checkout -b Publish

      - name: Hacer pull de la rama Publish
        run: git pull origin Publish --rebase

      # Recuperar el APK desde el temporal y ponerlo en la carpeta APK/
      - name: Copiar APK a carpeta APK en Publish
        run: |
          mkdir -p APK
          cp /tmp/apk/app-release.apk APK/app-release.apk

      - name: Agregar y commitear el APK (por si hay cambios nuevos)
        run: |
          git add APK/app-release.apk
          git commit -m "Subir APK generado automáticamente [skip ci]" || echo "No hay cambios para commitear"

      - name: Subir cambios a la rama Publish
        run: git push origin Publish

      - name: Subir APK como artefacto en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: APK de Producción
          path: APK/app-release.apk
