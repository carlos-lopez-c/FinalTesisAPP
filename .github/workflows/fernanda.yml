name: Build con SonarCloud y Pruebas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  FLUTTER_VERSION: '3.27.3'

jobs:
  analyze_and_build:
    name: Analizar y Construir
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Limpiar proyecto
        run: flutter clean

      - name: Instalar dependencias
        run: |
          flutter pub get
          echo "Paquetes desactualizados:"
          flutter pub outdated || true

      - name: Ejecutar pruebas unitarias
        id: tests
        continue-on-error: true  # Permite continuar aunque fallen las pruebas
        run: |
          flutter test || echo "::warning::Algunas pruebas fallaron"
          echo "tests_passed=$?" >> $GITHUB_OUTPUT

      - name: Generar cobertura
        if: steps.tests.outputs.tests_passed == '0'
        run: |
          flutter test --coverage
          genhtml coverage/lcov.info -o coverage/html

      - name: Configurar SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=carlos-lopez-c
            -Dsonar.projectKey=carlos-lopez-c_FinalTesisAPP
            -Dsonar.projectName=FinalTesisAPP
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.flutter.coverageReportPath=coverage/lcov.info
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.testExecutionReportPaths=test_report.json
            -Dsonar.analysis.ignoreTests=true

      - name: Crear CustomCard.dart
        run: |
          mkdir -p lib/auth/presentation/Widgets
          cat > lib/auth/presentation/Widgets/CustomCard.dart << 'EOF'
          import 'package:flutter/material.dart';
          class CustomCard extends StatelessWidget {
            final Widget child;
            const CustomCard({Key? key, required this.child}) : super(key: key);
            @override
            Widget build(BuildContext context) {
              return Card(child: child);
            }
          }
          EOF

      - name: Generar APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: APK_Produccion
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Verificar estado de pruebas
        if: steps.tests.outputs.tests_passed != '0'
        run: |
          echo "::error::Algunas pruebas unitarias fallaron"
          exit 1
