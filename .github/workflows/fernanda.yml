name: Generar APK para Producción con SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  FLUTTER_VERSION: '3.27.3'

jobs:
  analyze_and_build:
    name: Analizar, Testear y Generar APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Limpiar el proyecto Flutter
        run: flutter clean

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas unitarias
        run: flutter test

      - name: Generar cobertura (lcov)
        run: |
          flutter test --coverage
          genhtml coverage/lcov.info -o coverage/html

      - name: Configurar SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=carlos-lopez-c
            -Dsonar.projectKey=carlos-lopez-c_FinalTesisAPP
            -Dsonar.projectName=FinalTesisAPP
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.flutter.coverageReportPath=coverage/lcov.info
            -Dsonar.sources=lib
            -Dsonar.tests=test

      - name: Crear CustomCard.dart
        run: |
          mkdir -p lib/auth/presentation/Widgets
          cat > lib/auth/presentation/Widgets/CustomCard.dart << 'EOF'
          import 'package:flutter/material.dart';
          class CustomCard extends StatelessWidget {
            final Widget child;
            const CustomCard({Key? key, required this.child}) : super(key: key);
            @override
            Widget build(BuildContext context) {
              return Card(child: child);
            }
          }
          EOF

      - name: Generar APK en modo release
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Configurar usuario de GitHub Actions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preparar archivos para commit
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk app-release.apk
          git add app-release.apk
          git commit -m "Generado APK de producción con análisis SonarCloud [skip ci]"

      - name: Verificar cambios locales
        run: |
          git status
          git add .
          git commit -m "Cambios locales antes de pull [skip ci]" || echo "No hay cambios para confirmar"

      - name: Actualizar rama Publish
        run: |
          git checkout Publish || git checkout -b Publish
          git pull origin Publish --rebase || echo "No se pudo hacer pull, continuando..."
          git push origin Publish

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: APK de Producción
          path: app-release.apk

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: Coverage Report
          path: coverage/html
