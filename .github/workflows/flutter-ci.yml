name: Flutter CI/CD Pipeline Unificado

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter-ci.yml'

env:
  FLUTTER_VERSION: '3.27.3'

jobs:
  build_test_analyze_deploy:
    name: Flutter Build, Test & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Java para SonarCloud
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Instalar Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      # 4. Limpieza y dependencias
      - name: Clean & get packages
        run: |
          flutter clean
          flutter pub get

      # 5. Ejecutar pruebas y cobertura
      - name: Run tests with coverage
        run: |
          flutter test --coverage

      # 6. Análisis SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=carlos-lopez-c
            -Dsonar.projectKey=carlos-lopez-c_FinalTesisAPP
            -Dsonar.projectName=FinalTesisAPP
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ SONAR_TOKEN }}
            -Dsonar.sources=lib
            -Dsonar.tests=test
            -Dsonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart
            -Dsonar.dart.coverage.reportPaths=coverage/lcov.info

      # 7. Generar APK de producción
      - name: Build production APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          mkdir -p apk_output
          cp build/app/outputs/flutter-apk/app-release.apk apk_output/

      # 8. Subir a rama Publish
      - name: Update Publish branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout -b Publish 2>/dev/null || git checkout Publish
          git pull origin Publish --rebase || echo "No se pudo hacer rebase, continuando..."

          cp -r apk_output .
          git add apk_output/*
          git commit -m "Actualización automática del APK [skip ci]" || echo "No hay cambios para commit"
          git push origin Publish

      # 9. Subir artefacto del APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-apk
          path: apk_output/app-release.apk
          retention-days: 5