name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      security-events: write

    steps:
      # 1. Checkout con fetch completo (requerido por SonarCloud)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ¡Crítico para análisis preciso!

      # 2. Verificación de variables obligatorias (previene errores tempranos)
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "❌ ERROR: SONAR_TOKEN no está configurado en GitHub Secrets"
            exit 1
          fi
          if [ -z "${{ vars.SONAR_PROJECT_KEY }}" ]; then
            echo "❌ ERROR: SONAR_PROJECT_KEY no está en Variables"
            exit 1
          fi

      # 3. Configuración de Java (con fallback a JDK 11 si 17 falla)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: | 
            17
            11  # Fallback opcional
          distribution: 'temurin'

      # 4. Análisis con SonarCloud (VERSIÓN CORREGIDA)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2  # ✅ Versión oficial estable
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}  # Redundancia para seguridad
