name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

env:
  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}  # Define a nivel global
  SONAR_ORG: ${{ vars.SONAR_ORG }}

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Previene jobs colgados
    permissions:
      contents: read
      issues: write
      pull-requests: write
      security-events: write

    steps:
      # 1. Verificación del código + prevención de descarga incompleta
      - name: Checkout code (Full depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Obligatorio para análisis preciso
          persist-credentials: false  # Seguridad

      # 2. Pre-chequeo: Valida que las variables requeridas existen
      - name: Validate Environment Variables
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "❌ ERROR: SONAR_TOKEN no está configurado"
            exit 1
          fi
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "❌ ERROR: SONAR_PROJECT_KEY no está definido"
            exit 1
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}

      # 3. Configuración de JDK (con fallback a Java 11 si 17 falla)
      - name: Set up JDK
        uses: actions/setup-java@v4
        id: java
        with:
          java-version: |
            17
            11
          distribution: 'temurin'
          cache: 'maven'  # Habilita caching automático para Maven

      # 4. Build del proyecto (para Java/Maven) con verificación
      - name: Build with Maven (Skip Tests)
        if: contains(steps.java.outputs.java-version, '17') || contains(steps.java.outputs.java-version, '11')
        run: |
          mvn clean verify -B -DskipTests
          echo "✅ Build completado con Java ${{ steps.java.outputs.java-version }}"

      # 5. Cache inteligente (evita descargas redundantes)
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.sonar/cache
            ~/.m2/repository  # Cache adicional para Maven
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/pom.xml') }}-${{ hashFiles('**/src/**') }}
          restore-keys: |
            ${{ runner.os }}-sonar-
            ${{ runner.os }}-maven-

      # 6. Análisis SonarCloud con verificación de calidad
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ env.SONAR_ORG }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}  # Redundancia para seguridad
            -Dsonar.scm.provider=git
            -Dsonar.sourceEncoding=UTF-8

      # 7. Post-chequeo: Verifica que el análisis se completó
      - name: Verify Quality Gate
        run: |
          echo "✔️ Si ves 'QUALITY GATE PASSED', todo está correcto"
          echo "Revisa el informe en: https://sonarcloud.io/project/overview?id=$SONAR_PROJECT_KEY"
